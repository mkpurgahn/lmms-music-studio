name: Release

# Publishes @sarutobi-sasuke/lmms-mcp to npm with provenance through npm trusted publishing (OIDC).
# Runs when a version tag is pushed, or by hand from the Actions tab with a version tag selected.
# No npm token is stored in GitHub: this repository and this workflow file are registered as the package's trusted publisher.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # supplies the npm CLI that trusted publishing needs; the package itself supports Node 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify the tag matches the package version
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Select a version tag: a branch run cannot publish." >&2
            exit 1
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
          grep -q "version: '$PKG_VERSION'" server.mjs || { echo "server.mjs does not report $PKG_VERSION" >&2; exit 1; }
      - run: npm test
      - name: Server starts and lists its tools
        run: node .github/scripts/smoke-server.mjs
      - name: Package holds no audio, tests or private files
        run: node .github/scripts/check-pack.mjs
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
